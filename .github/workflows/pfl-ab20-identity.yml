name: PFL AB20 prospective identity research
on:
  push:
    branches:
      - research/pfl-ab20-identity-temporal-20261026
  workflow_dispatch:
jobs:
  official-id-source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: AB20 C01 institutional XV deputy index
        working-directory: proyectos/politics-fantasy-league
        run: python scripts/ab20_identity_index.py
      - name: C02 refresh official Congress JSON original roster
        working-directory: proyectos/politics-fantasy-league
        run: python scripts/probe_congress_opendata.py
      - name: C03 semantic-heading remediation against same 8 public profiles
        working-directory: proyectos/politics-fantasy-league
        run: python scripts/ab20_profile_semantic.py
      - name: Preserve original investigation receipts without person values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfl-ab20-evidence-${{ github.run_id }}
          path: /tmp/pfl-ab20/
          retention-days: 7
          if-no-files-found: warn
