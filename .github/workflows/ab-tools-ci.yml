name: AB tools pilot tests
on:
  pull_request:
    paths:
      - "ab_tools/**"
      - "tests/test_ab_tools.py"
      - "ab_atlas/**"
      - ".github/workflows/ab-tools-ci.yml"
  push:
    paths:
      - "ab_tools/**"
      - "tests/test_ab_tools.py"
      - "ab_atlas/**"
      - ".github/workflows/ab-tools-ci.yml"
permissions:
  contents: read
jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m compileall -q ab_tools
      - name: AB pilot contracts
        run: python -m unittest discover -s tests -p test_ab_tools.py -v
      - name: Atlas regressions
        run: python -m unittest discover -s ab_atlas/tests -p "test_*.py" -v
