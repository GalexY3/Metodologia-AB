name: PFL single Atlas94 canonical maintenance check
on:
  push:
    branches:
      - feature/pfl-p1-accounts
    paths:
      - .github/workflows/pfl-p1-c38-atlas94-recheck.yml
permissions:
  contents: read
jobs:
  original-canonical-atlas94:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original Atlas only after one observed C38, not a research cycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess, sys
          root=pathlib.Path('proyectos/politics-fantasy-league/ab_atlas')
          cmd=[sys.executable,'ab_atlas/atlas_delta.py']
          args=['--base',str(root/'seed.json'),'--updates',str(root/'updates')]
          a=subprocess.run(cmd+['check']+args,text=True,capture_output=True)
          print('ORIGINAL_CHECK_EXIT',a.returncode,flush=True)
          print('ORIGINAL_CHECK_TEXT',a.stdout.strip(),flush=True)
          assert a.returncode==0,a.stderr
          b=subprocess.run(cmd+['brief']+args+['--limit','4'],text=True,capture_output=True)
          assert b.returncode==0,b.stderr
          q=json.loads(b.stdout)
          assert q['head_batch']=='0094-PFL-ABH10-C38-FR-PETITIONS-20261030',q['head_batch']
          assert q.get('batch_count',94)==94, q.get('batch_count')
          print('PFL_ATLAS94_CANONICAL_SUMMARY',json.dumps({'head':q['head_batch'],'nodes':q['node_count'],'edges':q['edge_count'],'sha256':q['state_sha256']},sort_keys=True),flush=True)
          PY
