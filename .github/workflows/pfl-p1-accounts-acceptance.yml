name: PFL P1 local accounts isolated acceptance (one-shot)
on:
  push:
    branches:
      - feature/pfl-p1-accounts
    paths:
      - .github/workflows/pfl-p1-accounts-acceptance.yml
permissions:
  contents: read
concurrency:
  group: pfl-p1-accounts-acceptance-once
  cancel-in-progress: true
jobs:
  accounts-http-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Frozen code identity and minimal native Python / Node acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object proyectos/politics-fantasy-league/src/politics_fantasy/accounts.py)" = a0dfb700d7ed51a9553592c1a098f7ee90f3b6fa
          test "$(git hash-object proyectos/politics-fantasy-league/src/politics_fantasy/server.py)" = 78f221617231c6a09c11625ffbcf04732c5699b3
          test "$(git hash-object proyectos/politics-fantasy-league/tests/test_accounts.py)" = 372d2a30a4966b8138e95dc18bea67622a9442fd
          test "$(git hash-object proyectos/politics-fantasy-league/src/politics_fantasy/web/app.js)" = a6f378ae98959a5845050ad6a4ddcaf4023cc214
          cd proyectos/politics-fantasy-league
          python -m compileall -q src/politics_fantasy/accounts.py src/politics_fantasy/server.py
          node --check src/politics_fantasy/web/app.js
          python -m pip show pytest >/dev/null 2>&1 || python -m pip install -q pytest
          PYTHONPATH=src python -m pytest -q tests/test_accounts.py tests/test_product.py
          echo PFL_P1_ACCOUNT_HTTP_ACCEPTANCE_PASSED
