<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="tit desc">
<title id="tit">CT2 ordinal ESBM N127–N146 — sin mejora científica</title><desc id="desc">20 ciclos técnicos 0/3; CT2 científica 7 sobre 100 en los 4 cortes del bloque. La madurez técnica no es CT2.</desc>
<rect x="0" y="0" width="1000" height="520" fill="#101b29"/><text x="72" y="52" font-size="26" fill="white" font-family="Arial">CT2 · Mercados de pareja · nueva rama AB-H</text>
<text x="72" y="82" font-size="15" fill="#aebfd1" font-family="Arial">Escala ordinal 0–100; 20 tests de software y modelo sintético ≠ descubrimiento científico</text>
