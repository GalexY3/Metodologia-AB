<text x="90" y="445" fill="#f0bb66" font-family="Arial" font-size="16">N144: comparador de red antiguo NO invariante al renombrar agentes (20/20 fallos).</text>
<text x="90" y="474" fill="#aebfd1" font-family="Arial" font-size="14">Grado humano nuevo 0/3 · R5 externo STOP · no se recalibra CT2 por número de ciclos.</text></svg>