<g stroke="#304357" stroke-width="1"><line x1="90" y1="120" x2="915" y2="120"/><line x1="90" y1="171" x2="915" y2="171"/><line x1="90" y1="222" x2="915" y2="222"/><line x1="90" y1="273" x2="915" y2="273"/><line x1="90" y1="324" x2="915" y2="324"/><line x1="90" y1="375" x2="915" y2="375"/></g>
